[project]
name = "attendance-lab"
version = "0.1.1"
description = "Local PC/SC student attendance with private administration and a public display"
readme = "README.md"
requires-python = ">=3.14.7"
license = "MIT"
dependencies = ["PySide6>=6.11.2,<7"]

[project.optional-dependencies]
pcsc = ["pyscard>=2.3.1,<3; sys_platform == 'linux'"]

[project.scripts]
attendance-lab = "attendance_lab.bootstrap:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.16.6,<0.17", "pyright>=1.1.411,<2"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.10"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "examples/**", "uv.lock", ".python-version"]
